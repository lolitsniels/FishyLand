<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>FishyLand - Multiplayer Fishing</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3a5c; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
    #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
      color: #fdf1cf; font: 700 18px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; }
    #fallback a { color: #1a0f07; background: #ffd35a; padding: 12px 26px; border-radius: 999px; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <!-- The live multiplayer game runs on fishyland.com; itch.io shows it in this frame -->
  <iframe id="game" src="https://fishyland.com/?src=itch" allow="autoplay; fullscreen; clipboard-write; gamepad" allowfullscreen title="FishyLand"></iframe>
  <div id="fallback">
    <div>FishyLand couldn't load here.<br />Your browser may be blocking it.</div>
    <a href="https://fishyland.com/?src=itch" target="_blank" rel="noopener">Play on FishyLand.com</a>
  </div>
  <script>
    var ok = false;
    document.getElementById("game").addEventListener("load", function () { ok = true; });
    setTimeout(function () { if (!ok) document.getElementById("fallback").style.display = "flex"; }, 20000);
  </script>
</body>
</html>
