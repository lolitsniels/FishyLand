<!doctype html>
<html lang="en">
    <head>
        <script src="playgama-bridge.js"></script>
        <meta charset="utf-8" />
        <base href="./" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <meta name="theme-color" content="#0b3a5c" />
        <title>FishyLand</title>
        <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
        <link rel="stylesheet" href="fonts/fonts.css" />
        <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: #0b3a5c; overscroll-behavior: none; }
            body, #root { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
            input, textarea { -webkit-user-select: text; user-select: text; }
            img { -webkit-user-drag: none; }
            /* online-only actions (market, trophy wall, chat links, crafting, bosses) wait for the multiplayer version */
            [data-testid^="list-fish-"], [data-testid^="mount-fish-"], [data-testid^="link-chat-"], [data-testid="bait-selected-button"],
            [data-testid^="sell-gear-"], [data-testid^="sell-bait-"], [data-testid^="sell-ing-"], [data-testid="inventory-tab-ingredients"], [data-testid="inventory-tab-other"],
            [data-testid="shop-to-market"], [data-testid="shop-tab-enhance"], [data-testid="journal-tab-leviathans"], [data-testid="journal-tab-bosses"],
            [data-testid="keepnet-panel"] a[href*="profile"], [data-testid="inventory-use-filter"],
            [data-testid="profile-badges-hint"], [data-testid="title-picker-panel"], [data-testid="trophy-wall"], [data-testid^="unmount-"], [data-testid="shop-friend-slots"], [data-testid="rename-form"], [data-testid="rename-button"], [data-testid="shop-walls"], [data-testid^="badge-pin-"], [data-testid^="contract-market-"] { display: none !important; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <link rel="stylesheet" href="ui.css" />
    </body>
</html>
